name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://${{ github.actor }}:$HF_TOKEN@huggingface.co/spaces/nirsingh/alter-ego
          for i in 1 2 3; do
            git push hf main --force && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done  
